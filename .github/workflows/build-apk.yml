name: Build PulseDialer APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack PulseDialer Android Project
        run: |
          python3 - << 'EOF'
          import os, json, lzma, base64
          b64 = ""
          b64 = b64.strip() + "=" * (-len(b64.strip()) % 4)
          files = json.loads(lzma.decompress(base64.b64decode(b64)).decode("utf-8"))
          for path, content in files.items():
              os.makedirs(os.path.dirname(path) or ".", exist_ok=True)
              with open(path, "w", encoding="utf-8") as f:
                  f.write(content + "\n")
          print("Unpacked", len(files), "files successfully")
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk PulseDialer-ru-v1.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PulseDialer-APK
          path: PulseDialer-ru-v1.0.apk

      - name: Publish GitHub Release with APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v1.0.0 --yes || true
          gh release create v1.0.0 PulseDialer-ru-v1.0.apk --title "Pulse Звонки v1.0.0 (Android APK)" --notes "Готовый установочный файл APK приложения Pulse Звонки (на русском языке, 3 кнопки ответа при звонке, запись разговоров, карточки контактов и поиск записей)."
